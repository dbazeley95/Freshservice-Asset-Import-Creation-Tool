name: Deploy to Cloudflare Workers

# Cloudflare's own dashboard Git integration for this project only runs a
# deploy when manually triggered from the dashboard (see "Recent builds" on
# the Deployments tab) — it doesn't auto-deploy on push. This workflow is
# what actually wires "push to this branch" to "site updates", the same way
# GitHub Pages already does.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Assets-only deploys (no `main` entry point, just wrangler.jsonc's
          # `assets.directory`) need Wrangler 4 — the action's default (3.x)
          # still requires a `main` script and fails with "Missing
          # entry-point" otherwise. Pinned to an exact version rather than
          # the floating '4' tag: that previously resolved to 4.122.0, whose
          # miniflare dependency wasn't yet resolvable on npm (a transient
          # upstream publish/propagation issue), breaking the deploy through
          # no fault of our own config. 4.121.0 is the version that's
          # actually succeeded here before.
          wranglerVersion: '4.121.0'
